name: Build

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "*" ]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false

      matrix:
        os:
          - windows-latest
          - ubuntu-latest
          - macos-latest

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build Release
        run: cargo build --release --all-features